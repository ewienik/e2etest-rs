[workspace]
members = ["crates/*"]
default-members = ["crates/e2etest"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.97"
async-backtrace = "0.2.7"
axum = "0.8.9"
convert_case = "0.12.0"
e2etest-macros = { path = "crates/e2etest-macros", version = "0.2.0" }
futures = "0.3.31"
hickory-server = "0.26.1"
ipc-channel = "0.23.0"
itertools = "0.15.0"
linkme = "0.3.36"
neli = { version = "0.7.4", default-features = false, features = ["sync", "async"] }
nix = { version = "0.31.3", features = ["hostname", "mount", "net", "process", "sched", "user"] }
num-bigint = "0.4"
proc-macro2 = "1.0.106"
quote = "1.0.0"
rustls = "0.23"
rustls-pki-types = "1.13.1"
rcgen = "0.14.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
scylla-proxy = "0.0.8"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.151"
syn = { version = "3.0.6", features = ["full"] }
sysinfo = "0.39.6"
tap = "1.0.1"
tempfile = "3.20.0"
thiserror = "2.0.20"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }


[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
